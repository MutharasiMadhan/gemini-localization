<div class="container">
    <h1>Gemini Translator</h1>
    <div class="upload-section">
        <input type="file" (change)="onFileSelected($event)">
        <button (click)="translateFile()">Translate File</button>
    </div>
    <div *ngIf="translatedFile" class="result-section">
        <h2>Translated File</h2>
        <p>{{ translatedFile }}</p>
    </div>
</div>
<div class="translate-section">
    <h2>Translate Text</h2>
    <textarea [(ngModel)]="textToTranslate" placeholder="Enter text here"></textarea>
    <button (click)="translateText()">Translate Text</button>
    <div *ngIf="translatedText">
        <h3>Translated Text</h3>
        <p>{{ translatedText }}</p>
    </div>
</div>
